# Builds a real, installable JARVIS Android debug APK.
#
# The Android project (web/android) is a standard Capacitor 7 wrapper around the
# original Vite front-end. The FastAPI backend is NOT part of the APK — the app
# connects to a user-configured backend host (docs/android/BACKEND.md).
#
# The APK is uploaded as the artifact "JARVIS-Android-debug-APK":
#   Repo → Actions → android-apk → run → Artifacts → JARVIS-Android-debug-APK
#
# The job never publishes an artifact after a failed build: the verification
# step fails the run before upload if the APK is missing or truncated.

name: android-apk

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "web/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 20 (npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Deliberately NOT android-actions/setup-android: that action runs
      # `sdkmanager tools`, and Google removed the standalone `tools` package,
      # so the job died before Gradle started (run #3). The GitHub-hosted image
      # already ships cmdline-tools, platform-tools and platform 35; we only
      # accept licences and make sure the two packages AGP needs are present.
      - name: Prepare the preinstalled Android SDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::No sdkmanager found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          test -d "$ANDROID_HOME/platforms/android-35"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          java -version

      - name: Install dependencies (lockfile, no upgrades)
        working-directory: web
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund

      - name: Run unit tests
        working-directory: web
        run: |
          set -euo pipefail
          npm test

      - name: Production web build
        working-directory: web
        run: |
          set -euo pipefail
          npm run build
          test -s dist/index.html

      - name: Sync build + native plugins into the Android project
        working-directory: web
        run: |
          set -euo pipefail
          npx cap sync android

      - name: Assemble debug APK
        working-directory: web/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace --console=plain

      - name: Verify the APK exists, is non-empty and contains the web bundle
        id: verify
        run: |
          set -euo pipefail
          APK="web/android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Build finished but app-debug.apk was not produced"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::app-debug.apk is suspiciously small (${SIZE} bytes) — the web bundle is probably missing"
            exit 1
          fi
          if ! unzip -l "$APK" | grep -q "assets/public/index.html"; then
            echo "::error::APK does not contain assets/public/index.html (cap sync did not copy the HUD)"
            exit 1
          fi
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          {
            echo "size=$SIZE"
            echo "sha256=$SHA"
          } >> "$GITHUB_OUTPUT"
          echo "app-debug.apk: ${SIZE} bytes, sha256 ${SHA}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-debug-APK
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          if-no-files-found: ignore
          retention-days: 7
          path: |
            web/android/app/build/reports/**
            web/android/build/reports/**
            web/npm-debug.log
